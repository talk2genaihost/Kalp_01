<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Rashi Dashboard — First Slice</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow{color:#64748b;font-size:.8rem}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 5px 18px #0f172a0b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;background:white}button{cursor:pointer;background:#312e81;color:white;border-color:#312e81}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.rashi{padding:13px;border:1px solid #e2e8f0;border-radius:12px;text-align:left;color:#172033;background:#fff}.rashi[aria-pressed=true]{outline:3px solid #c4b5fd;border-color:#7c3aed}.muted{color:#64748b}.notice{background:#fffbeb;border:1px solid #fde68a;padding:11px;border-radius:10px;margin-top:12px;font-size:.9rem}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.columns{grid-template-columns:1fr}.app{padding:12px}h1{font-size:1.5rem}}label{display:grid;gap:5px;font-size:.9rem;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:500px){.formgrid{grid-template-columns:1fr}}#answer{white-space:pre-wrap;line-height:1.5}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">KALP Development Studio · First executable UI slice</div><h1 id="title">साप्ताहिक राशिफल</h1><div class="muted" id="subtitle">डेमो सामग्री — वास्तविक ज्योतिषीय गणना नहीं</div></div><div class="toolbar"><label for="language" id="languageLabel">भाषा</label><select id="language"><option value="hi">हिन्दी</option><option value="en">English</option></select></div></header>
  <section class="panel"><h2 id="chooseTitle">अपनी राशि चुनें</h2><div class="grid" id="rashiGrid"></div><div class="notice" id="demoNotice"></div></section>
  <div class="columns"><section class="panel"><h2 id="weeklyTitle">साप्ताहिक संदेश</h2><h3 id="selectedName"></h3><p id="weeklyText"></p></section><section class="panel"><h2 id="assistantTitle">जन्म-विवरण सहायक</h2><p class="muted" id="assistantIntro">यह प्रारम्भिक डेमो केवल इनपुट सत्यापन और नमूना उत्तर दिखाता है।</p><form id="birthForm"><div class="formgrid"><label><span id="dateLabel">जन्म तारीख</span><input id="birthDate" type="date" required></label><label><span id="timeLabel">जन्म समय</span><input id="birthTime" type="time" required></label></div><label><span id="placeLabel">जन्म स्थान</span><input id="birthPlace" required placeholder="शहर"></label><button type="submit" id="askButton">नमूना उत्तर देखें</button></form><p id="answer" class="notice" hidden></p></section></div>
</main>
<script>
const data={
 hi:[['मेष','नयी शुरुआत के लिए ऊर्जा बनाए रखें।'],['वृषभ','धैर्य और नियमितता लाभ देगी।'],['मिथुन','बातचीत से अवसर खुलेंगे।'],['कर्क','परिवार और विश्राम को समय दें।'],['सिंह','रचनात्मक काम में आत्मविश्वास रखें।'],['कन्या','छोटे सुधार बड़ा असर ला सकते हैं।'],['तुला','निर्णय लेते समय संतुलन रखें।'],['वृश्चिक','गोपनीय योजनाओं को सोच-समझकर साझा करें।'],['धनु','सीखने और यात्रा की योजना बनाएं।'],['मकर','लक्ष्य को छोटे चरणों में बांटें।'],['कुंभ','नया दृष्टिकोण सहयोगी सिद्ध हो सकता है।'],['मीन','अंतर्ज्ञान के साथ व्यावहारिकता भी रखें।']],
 en:[['Aries','Protect your energy while starting something new.'],['Taurus','Patience and consistency can help.'],['Gemini','Conversation may open useful opportunities.'],['Cancer','Make room for family and rest.'],['Leo','Bring confidence to creative work.'],['Virgo','Small improvements can create momentum.'],['Libra','Keep balance while making decisions.'],['Scorpio','Share sensitive plans thoughtfully.'],['Sagittarius','Plan time for learning or travel.'],['Capricorn','Break large goals into smaller steps.'],['Aquarius','A new perspective may support collaboration.'],['Pisces','Pair intuition with practical action.']]
};
let lang='hi', selected=0; const $=id=>document.getElementById(id);
function render(){const d=data[lang]; $('title').textContent=lang==='hi'?'साप्ताहिक राशिफल':'Weekly Horoscope';$('subtitle').textContent=lang==='hi'?'डेमो सामग्री — वास्तविक ज्योतिषीय गणना नहीं':'Demo content — not a real astrological calculation';$('languageLabel').textContent=lang==='hi'?'भाषा':'Language';$('chooseTitle').textContent=lang==='hi'?'अपनी राशि चुनें':'Choose your sign';$('weeklyTitle').textContent=lang==='hi'?'साप्ताहिक संदेश':'Weekly message';$('assistantTitle').textContent=lang==='hi'?'जन्म-विवरण सहायक':'Birth-details assistant';$('assistantIntro').textContent=lang==='hi'?'यह प्रारम्भिक डेमो केवल इनपुट सत्यापन और नमूना उत्तर दिखाता है।':'This first slice validates inputs and shows a sample response.';$('dateLabel').textContent=lang==='hi'?'जन्म तारीख':'Birth date';$('timeLabel').textContent=lang==='hi'?'जन्म समय':'Birth time';$('placeLabel').textContent=lang==='hi'?'जन्म स्थान':'Birth place';$('askButton').textContent=lang==='hi'?'नमूना उत्तर देखें':'Show sample answer';$('demoNotice').textContent=lang==='hi'?'स्रोत स्थिति: DEMO. गणना सेवा अभी जोड़ी नहीं गई है।':'Source status: DEMO. Calculation service is not connected yet.';$('rashiGrid').innerHTML=d.map((x,i)=>`<button class="rashi" aria-pressed="${i===selected}" data-i="${i}">${x[0]}</button>`).join('');document.querySelectorAll('.rashi').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});$('selectedName').textContent=d[selected][0];$('weeklyText').textContent=d[selected][1];}
$('language').onchange=e=>{lang=e.target.value;render()};$('birthForm').onsubmit=e=>{e.preventDefault();const place=$('birthPlace').value.trim();$('answer').hidden=false;$('answer').textContent=lang==='hi'?`नमूना उत्तर: ${place} के लिए जन्म विवरण प्राप्त हुए। विस्तृत उत्तर देने से पहले प्रमाणित गणना पद्धति, समय-क्षेत्र और जन्म-स्थान सत्यापन आवश्यक हैं।`:`Sample response: birth details for ${place} were received. A verified calculation method, time zone, and place validation are required before a detailed answer.`};render();
</script>
</body></html>
