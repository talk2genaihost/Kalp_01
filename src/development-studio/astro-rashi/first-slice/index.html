<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Rashi Dashboard</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow,.muted{color:#64748b}.eyebrow{font-size:.8rem}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 5px 18px #0f172a0b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;background:#fff}button{cursor:pointer;background:#312e81;color:#fff;border-color:#312e81}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.rashi{padding:13px;border:1px solid #e2e8f0;border-radius:12px;text-align:left;color:#172033;background:#fff}.rashi[aria-pressed=true]{outline:3px solid #c4b5fd;border-color:#7c3aed}.notice{background:#fffbeb;border:1px solid #fde68a;padding:11px;border-radius:10px;margin-top:12px;font-size:.9rem}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.coordinate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:.9rem;margin-top:10px}#answer{white-space:pre-wrap;line-height:1.5}@media(max-width:700px){.columns{grid-template-columns:1fr}.app{padding:12px}h1{font-size:1.5rem}}@media(max-width:500px){.formgrid,.coordinate-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">KALP Development Studio · First executable UI slice</div><h1 id="title">साप्ताहिक राशिफल</h1><div class="muted" id="subtitle">डेमो सामग्री — वास्तविक ज्योतिषीय गणना नहीं</div></div><div class="toolbar"><label for="language" id="languageLabel">भाषा</label><select id="language"><option value="hi">हिन्दी</option><option value="en">English</option></select></div></header>
  <section class="panel"><h2 id="chooseTitle">अपनी राशि चुनें</h2><div class="grid" id="rashiGrid"></div><div class="notice" id="demoNotice"></div></section>
  <div class="columns"><section class="panel"><h2 id="weeklyTitle">साप्ताहिक संदेश</h2><h3 id="selectedName"></h3><p id="weeklyText"></p></section><section class="panel"><h2 id="assistantTitle">जन्म-विवरण सहायक</h2><p class="muted" id="assistantIntro">जन्म-विवरण भरकर वास्तविक वैदिक कुंडली डेटा प्राप्त करें।</p><form id="birthForm"><div class="formgrid"><label><span id="dateLabel">जन्म तारीख</span><input id="birthDate" type="date" required></label><label><span id="timeLabel">जन्म समय</span><input id="birthTime" type="time" required></label></div><label><span id="placeLabel">जन्म स्थान</span><input id="birthPlace" required placeholder="शहर"></label><div class="coordinate-grid"><label><span>अक्षांश / Latitude</span><input id="latitude" type="number" step="any" required placeholder="28.6139"></label><label><span>देशांतर / Longitude</span><input id="longitude" type="number" step="any" required placeholder="77.2090"></label></div><button type="submit" id="askButton">कुंडली डेटा प्राप्त करें</button></form><p id="answer" class="notice" hidden></p></section></div>
</main>
<script type="module" src="../browser-entry.ts"></script>
</body>
</html>
