<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KALP Weather Flash</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <div class="eyebrow">KALP DEVELOPMENT STUDIO</div>
        <h1>Weather Flash</h1>
        <p>6 cities · 6 days · live local clocks</p>
      </div>
      <button id="refresh" type="button">↻ Refresh</button>
    </header>
    <div id="status" class="status">Loading weather…</div>
    <section id="dashboard" class="grid" aria-live="polite"></section>
    <footer>Forecast source: Open-Meteo · Local time is resolved from each city's timezone.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
