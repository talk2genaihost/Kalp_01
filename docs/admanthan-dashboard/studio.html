<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KALP AdManthan Studio</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><style>body{font:14px Arial;background:#080a0f;color:#eee;margin:0}main{max-width:1200px;margin:auto;padding:24px}.panel{background:#11151d;border:1px solid #29313d;border-radius:14px;padding:20px;margin-bottom:16px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;color:#929dae;font-size:11px;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;background:#090c12;color:white;border:1px solid #39414d;border-radius:7px}textarea{min-height:70px}button{margin:12px 8px 0 0;padding:11px 15px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}button{background:#eee;color:#080a0f}button.alt{background:#1b2029;color:#eee}.status{margin-top:12px;padding:10px;background:#090c12;border:1px solid #29313d}.ok{color:#8ed0a5}.warn{color:#e8c477}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0b0f15;border:1px solid #2b333f;border-radius:10px;padding:14px}.effect{border-top:1px solid #252c36;margin-top:9px;padding-top:9px}.effect select{font:11px monospace}.muted{color:#8b96a6;font-size:11px}.hidden{display:none}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.shot{border:1px solid #303846;border-radius:10px;padding:14px}.package{white-space:pre-wrap;max-height:400px;overflow:auto;background:#080b10;padding:12px;font:11px monospace}.research{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source{border:1px solid #29313d;border-radius:9px;padding:11px;background:#0b0f15}.source a{color:#b8c7ff;word-break:break-all}@media(max-width:800px){.form,.grid,.board,.research{grid-template-columns:1fr}}</style></head><body><main><section class="panel"><h1>KALP AdManthan Studio</h1><p class="muted">Brief → Research → Context Pack → Strategy → Scenes → Effects → Storyboard</p><div class="form"><div><label>BRAND</label><input id="brand" placeholder="Enter brand"></div><div><label>PRODUCT / OFFER</label><input id="product" placeholder="Enter product"></div><div><label>AUDIENCE</label><input id="audience" placeholder="Target audience"></div><div><label>MARKET / CATEGORY</label><input id="market" placeholder="Market or category"></div><div><label>COUNTRY</label><input id="country" placeholder="Country"></div><div><label>OBJECTIVE</label><select id="objective"><option>Brand Awareness</option><option>Consideration</option><option>Conversion</option><option>Launch</option></select></div><div><label>TONE</label><select id="tone"><option>Cinematic</option><option>Premium</option><option>Emotional</option><option>Energetic</option><option>Trust-led</option></select></div><div><label>CTA</label><input id="cta" placeholder="Desired action"></div><div><label>KEY MESSAGE</label><textarea id="message" placeholder="What should audience remember?"></textarea></div><div><label>RESEARCH QUESTION (OPTIONAL)</label><textarea id="question" placeholder="What specifically should Research investigate?"></textarea></div><div><label>LANGUAGE</label><select id="language"><option>Hindi</option><option>English</option><option>Hinglish</option></select></div></div><button id="researchBtn" onclick="research()">RESEARCH</button><button id="run" onclick="run()" disabled>LOADING…</button><button class="alt" id="str" onclick="strategy()" disabled>RUN STRATEGY</button><button class="alt" id="scn" onclick="scenes()" disabled>GENERATE SCENES</button><button class="alt" id="brd" onclick="board()" disabled>BUILD STORYBOARD</button><button class="alt" id="exp" onclick="exportPkg()" disabled>EXPORT JSON</button><div id="status" class="status">Starting…</div></section><section id="researchPanel" class="panel hidden"><h2>Research Analyst</h2><div id="researchOut"></div></section><section id="strategyPanel" class="panel hidden"><h2>Strategy</h2><div id="strategyOut"></div></section><section id="scenePanel" class="panel hidden"><h2>Scenes + Effect Intelligence</h2><div id="sceneOut" class="grid"></div></section><section id="boardPanel" class="panel hidden"><h2>Storyboard</h2><div id="boardOut" class="board"></div></section><section id="pkgPanel" class="panel hidden"><h2>Production Package</h2><div id="pkg" class="package"></div></section></main><script>const LIB='https://raw.githubusercontent.com/talk2genaihost/Kalp-Ecosystem/main/modules/admanthan/Ad_Manthan_Effect_Shortcut_Library_v0_1.xlsx',PY='./admanthan_browser.py',RESEARCH='https://cfwrgalgscieddkcrtde.supabase.co/functions/v1/admanthan-research',SUPABASE_PUBLIC_KEY='sb_publishable_BA0NYqjcZc-tFESt94uWjg_cJ3gg-N1';let rows=[],py,result,researchResult;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,c=''){ $('status').innerHTML='<span class="'+c+'">'+esc(t)+'</span>'}function brief(){return {brand:$('brand').value.trim(),product:$('product').value.trim(),audience:$('audience').value.trim(),market:$('market').value.trim(),country:$('country').value.trim(),objective:$('objective').value,tone:$('tone').value,cta:$('cta').value.trim(),message:$('message').value.trim(),research_question:$('question').value.trim(),language:$('language').value}}async function research(){const b=brief();if(!b.brand&&!b.product&&!b.research_question){msg('Enter Brand, Product, or a Research Question first.','warn');return}$('researchBtn').disabled=true;$('researchBtn').textContent='RESEARCHING…';try{msg('Running live DuckDuckGo research…','warn');const r=await fetch(RESEARCH,{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_PUBLIC_KEY,'Authorization':'Bearer '+SUPABASE_PUBLIC_KEY},body:JSON.stringify(b)});const text=await r.text();let j;try{j=JSON.parse(text)}catch(_){throw Error('Research endpoint returned non-JSON HTTP '+r.status)}researchResult=j;if(!r.ok||j.status==='FAILED')throw Error(j.message||j.error||'Research failed');renderResearch();msg(j.status==='RESEARCHED'?'Research completed — Context Pack ready ✓':'Research returned insufficient evidence.','ok');}catch(e){msg('RESEARCH ERROR: '+e.message,'warn')}finally{$('researchBtn').disabled=false;$('researchBtn').textContent='RESEARCH'}}function renderResearch(){const j=researchResult;$('researchPanel').classList.remove('hidden');const cp=j.context_pack||{};let src=(j.sources||[]).map(x=>'<div class="source"><b>'+esc(x.title)+'</b><p>'+esc(x.snippet)+'</p><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.url)+'</a><div class="muted">'+esc(x.source_type)+'</div></div>').join('');$('researchOut').innerHTML='<p><b>Provider:</b> '+esc(j.provider)+' &nbsp; <b>Status:</b> '+esc(j.status)+' &nbsp; <b>Sources:</b> '+esc(j.source_count)+'</p><h3>Research Questions</h3><ul>'+((j.research_questions||[]).map(q=>'<li>'+esc(q)+'</li>').join(''))+'</ul><h3>Context Pack</h3><p><b>Confidence:</b> '+esc(cp.confidence||'—')+'</p><div class="research">'+src+'</div>'}function exec(){let b=brief();if(!b.brand||!b.product||!b.message)throw Error('Enter Brand, Product and Key Message.');py.globals.set('ROWS_JSON',JSON.stringify(rows));py.globals.set('BRIEF_JSON',JSON.stringify({...b,research_context:researchResult?.context_pack||null}));return JSON.parse(py.runPython("import json\njson.dumps(execute(json.loads(ROWS_JSON),json.loads(BRIEF_JSON)),ensure_ascii=False)"))}async function boot(){try{let r=await fetch(LIB,{cache:'no-store'}),w=XLSX.read(await r.arrayBuffer(),{type:'array'});w.SheetNames.forEach(s=>XLSX.utils.sheet_to_json(w.Sheets[s],{defval:''}).forEach(x=>{if(x.Shortcut)rows.push({...x,sheet:s})}));py=await loadPyodide();r=await fetch(PY,{cache:'no-store'});py.runPython(await r.text());['run','str','scn'].forEach(x=>$(x).disabled=false);msg('READY — enter your brief or run Research first.','ok')}catch(e){msg('STARTUP ERROR: '+e.message,'warn')}}function run(){try{result=exec();renderStrategy();renderScenes();renderBoard();renderPkg();msg(researchResult?'Full pipeline executed with Research Context ✓':'Full brief-driven pipeline executed ✓','ok')}catch(e){msg(e.message,'warn')}}function strategy(){try{result=exec();renderStrategy();msg('Strategy generated from current brief + research context ✓','ok')}catch(e){msg(e.message,'warn')}}function scenes(){try{result=exec();renderScenes();$('brd').disabled=false;$('exp').disabled=false;msg('Six scenes generated from current brief ✓','ok')}catch(e){msg(e.message,'warn')}}function renderStrategy(){$('strategyPanel').classList.remove('hidden');let s=result.strategy;$('strategyOut').innerHTML='<b>Route:</b> '+esc(s.creative_route)+'<br><b>Arc:</b> '+esc(s.narrative_arc)+'<br><b>Objective:</b> '+esc(s.objective)+'<br><b>Audience:</b> '+esc(s.audience)+'<br><b>Message:</b> '+esc(s.key_message)+'<br><b>CTA:</b> '+esc(s.cta)}function opts(sel){return rows.map(r=>'<option '+(r.Shortcut===sel?'selected':'')+' value="'+esc(r.Shortcut)+'">'+esc(r.Shortcut)+' — '+esc(r.Capability)+'</option>').join('')}function renderScenes(){$('scenePanel').classList.remove('hidden');$('sceneOut').innerHTML=result.scenes.map((s,i)=>'<article class="card"><b>Scene '+s.scene+'</b> <span class="muted">'+s.timecode+'</span><p>'+esc(s.story_purpose)+'</p>'+[0,1,2].map(j=>'<div class="effect"><label>Effect '+(j+1)+'</label><select onchange="change('+i+','+j+',this.value)">'+opts(s.effects[j]?.shortcut)+'</select></div>').join('')+'<p><b>VO:</b> '+esc(s.vo)+'</p><span class="muted">'+esc((s.sound||[]).join(' • '))+'</span></article>').join('')}function change(i,j,k){let r=rows.find(x=>x.Shortcut===k);if(!r)return;result.scenes[i].effects[j]={shortcut:r.Shortcut,capability:r.Capability,intent:r['Primary Use / Intent'],application:r['Scene Recipe'],sheet:r.sheet};renderPkg();msg('Effect replaced from live library ✓','ok')}function renderBoard(){$('boardPanel').classList.remove('hidden');$('boardOut').innerHTML=result.scenes.map(s=>'<div class="shot"><b>FRAME '+s.scene+'</b> '+s.timecode+'<p>'+esc(s.story_purpose)+'</p><p>'+s.effects.map(e=>'<code>'+esc(e.shortcut)+'</code> ').join('')+'</p><p><b>VO:</b> '+esc(s.vo)+'</p></div>').join('')}function renderPkg(){$('pkgPanel').classList.remove('hidden');$('pkg').textContent=JSON.stringify({...result,research:researchResult||null,generated_at:new Date().toISOString()},null,2);$('exp').disabled=false}function board(){if(!result)try{result=exec()}catch(e){msg(e.message,'warn');return}renderBoard();renderPkg();msg('Storyboard built ✓','ok')}function exportPkg(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...result,research:researchResult||null},null,2)],{type:'application/json'}));a.download='KALP_AdManthan_Production_Package.json';a.click()}boot();</script></body></html>
