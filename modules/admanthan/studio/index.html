<!doctype html><html><head><meta charset="utf-8"><title>KALP AdManthan</title><style>body{font-family:Arial;margin:0;background:#111;color:#eee}header{padding:22px 28px;background:#171717;border-bottom:1px solid #333}main{padding:28px;max-width:1100px;margin:auto}input,button{padding:12px;margin:6px 4px;background:#222;color:#fff;border:1px solid #555}button{cursor:pointer} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#1b1b1b;border:1px solid #333;padding:14px;min-height:150px}.tag{font-size:12px;color:#aaa}.effect{font-family:monospace;margin:5px 0}</style></head><body><header><b>KALP AdManthan</b> — AI Advertising Intelligence & Creative Production</header><main><input id=b placeholder="Brand" value="Paramount GolfForeste"><input id=p placeholder="Product" value="Luxury residential development"><button onclick=go()>GENERATE 15s / 6 FRAMES</button><pre id=master></pre><div id=out class=grid></div></main><script>async function go(){let r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:b.value,product:p.value})});let x=await r.json();master.textContent='CONTINUOUS VO: '+x.continuous_vo;out.innerHTML=x.scenes.map(s=>`<div class=card><b>FRAME ${s.scene}</b> <span class=tag>${s.timecode}</span><p>${s.story_purpose}</p>${s.effects.map(e=>`<div class=effect>${e.shortcut}</div><div class=tag>${e.application}</div>`).join('')}<p><b>VO:</b> ${s.vo}</p></div>`).join('')}</script></body></html>
