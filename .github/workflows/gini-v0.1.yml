name: Gini v0.1 Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Gini smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genie/v0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run unit and contract tests
        run: python -m pytest -q

  stress:
    name: Gini 1000-scenario stress test
    runs-on: ubuntu-latest
    needs: smoke
    defaults:
      run:
        working-directory: genie/v0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run stress test
        env:
          GINI_STRESS_SCENARIOS: '1000'
        run: python -m pytest -q tests/test_stress.py -s
