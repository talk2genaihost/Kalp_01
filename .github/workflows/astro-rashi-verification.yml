name: Astro Rashi Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "${PR_NUMBER}" ]; then
            git fetch --depth 1 origin "refs/pull/${PR_NUMBER}/head"
            git checkout FETCH_HEAD
          else
            git fetch --depth 1 origin "${GITHUB_SHA}"
            git checkout FETCH_HEAD
          fi

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Astro Rashi browser build
        run: npm run build:astro-rashi

      - name: Test suite
        run: npm test

      - name: Gini v0.1 smoke tests
        working-directory: genie/v0.1
        run: |
          python3 --version
          python3 -m pip install --upgrade pytest
          PYTHONPATH=. python3 -m pytest -q

      - name: Gini v0.1 1000-scenario stress test
        working-directory: genie/v0.1
        env:
          GINI_STRESS_SCENARIOS: '1000'
        run: PYTHONPATH=. python3 -m pytest -q tests/test_stress.py -s
