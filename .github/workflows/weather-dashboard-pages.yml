name: Deploy KALP Weather Flash

on:
  push:
    branches:
      - feat/weather-six-city-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/development-studio/weather-flash-dashboard

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
