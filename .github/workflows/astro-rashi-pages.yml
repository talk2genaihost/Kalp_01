name: Deploy KALP Applications to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}
  WEATHER_SOURCE_BRANCH: main
  VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without external action
        run: |
          set -eu
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Restore Weather application from source branch
        run: |
          set -eu
          rm -rf /tmp/weather-source
          git clone --depth 1 --branch "${WEATHER_SOURCE_BRANCH}" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/weather-source
          test -f /tmp/weather-source/weather-dashboard/index.html
          test -f /tmp/weather-source/weather-dashboard/app.js
          test -f /tmp/weather-source/weather-dashboard/styles.css

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro Rashi browser slice
        run: npm run build:astro-rashi

      - name: Assemble published applications
        run: |
          set -eu
          rm -rf /tmp/published-site
          mkdir -p /tmp/published-site/weather-dashboard
          mkdir -p /tmp/published-site/astro-rashi
          mkdir -p /tmp/published-site/admanthan

          cp -R /tmp/weather-source/weather-dashboard/. /tmp/published-site/weather-dashboard/
          cp -R dist/astro-rashi/. /tmp/published-site/astro-rashi/
          cp -R docs/admanthan-dashboard/. /tmp/published-site/admanthan/
          cp docs/admanthan-dashboard/studio.html /tmp/published-site/admanthan/index.html

          # v0.8.9 runtime integration: preserve the v0.8.8 engine unchanged,
          # then append the semantic-fit gate and wrap choose_effects().
          cat docs/admanthan-dashboard/semantic_fit_gate.py >> /tmp/published-site/admanthan/admanthan_browser.py
          cat >> /tmp/published-site/admanthan/admanthan_browser.py <<'PY'

# KALP AdManthan v0.8.9 runtime integration.
# The original v0.8.8 choose_effects remains the production selector. This
# wrapper only removes semantically incompatible library rows before delegating
# to it, preserving v0.8.8 shot-fit, necessity, no-padding and diversity gates.
_KALP_V088_CHOOSE_EFFECTS = choose_effects

def choose_effects(rows, scene, limit=3):
    semantic_rows = []
    diagnostics = []
    for row in rows or []:
        fit = evaluate_effect(scene, row)
        diagnostics.append(fit)
        if fit.get('compatibility') != 'INCOMPATIBLE':
            semantic_rows.append(row)
    result = _KALP_V088_CHOOSE_EFFECTS(semantic_rows, scene, limit)
    if isinstance(result, dict):
        result['semantic_fit_version'] = VERSION
        result['semantic_fit_diagnostics'] = diagnostics
    return result
PY

          # Keep the browser cache-buster/version label aligned with the live engine.
          sed -i 's/admanthan_browser.py?v=0.8.5/admanthan_browser.py?v=0.8.9/' /tmp/published-site/admanthan/index.html

          python -m py_compile /tmp/published-site/admanthan/admanthan_browser.py

          cat > /tmp/published-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>KALP Applications</title></head>
          <body><h1>KALP Applications</h1><ul><li><a href="./weather-dashboard/">Weather Dashboard</a></li><li><a href="./astro-rashi/">Astro Rashi Dashboard</a></li><li><a href="./admanthan/">KALP AdManthan</a></li><li><a href="./admanthan/research.html">AdManthan Research</a></li></ul></body></html>
          EOF

          cat > /tmp/published-site/astro-rashi.html <<'EOF'
          <!doctype html><meta http-equiv="refresh" content="0; url=./astro-rashi/" /><link rel="canonical" href="./astro-rashi/" /><title>Astro Rashi Dashboard</title>
          EOF
          touch /tmp/published-site/.nojekyll

      - name: Publish static site to gh-pages
        run: |
          set -eu
          rm -rf /tmp/deploy-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/deploy-repo
          cd /tmp/deploy-repo
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/published-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy KALP Applications"
          git push --force origin gh-pages
