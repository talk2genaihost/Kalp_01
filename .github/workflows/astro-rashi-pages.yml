name: Deploy Astro Rashi to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without external action
        run: |
          set -eu
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Preserve currently published Weather application
        run: |
          set -eu
          rm -rf /tmp/current-weather
          mkdir -p /tmp/current-weather
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/current-pages
            if [ -d /tmp/current-pages/weather-dashboard ]; then
              cp -R /tmp/current-pages/weather-dashboard/. /tmp/current-weather/
            elif [ -f /tmp/current-pages/index.html ]; then
              cp -R /tmp/current-pages/. /tmp/current-weather/
            fi
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro Rashi browser slice
        run: npm run build:astro-rashi

      - name: Assemble separate application pages
        run: |
          set -eu
          rm -rf /tmp/published-site
          mkdir -p /tmp/published-site/weather-dashboard
          mkdir -p /tmp/published-site/astro-rashi

          if [ -n "$(find /tmp/current-weather -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            cp -R /tmp/current-weather/. /tmp/published-site/weather-dashboard/
          fi

          cp -R dist/astro-rashi/. /tmp/published-site/astro-rashi/

          cat > /tmp/published-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>KALP Applications</title>
            </head>
            <body>
              <h1>KALP Applications</h1>
              <ul>
                <li><a href="./weather-dashboard/">Weather Dashboard</a></li>
                <li><a href="./astro-rashi/">Astro Rashi Dashboard</a></li>
              </ul>
            </body>
          </html>
          EOF

          cat > /tmp/published-site/astro-rashi.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./astro-rashi/" />
          <link rel="canonical" href="./astro-rashi/" />
          <title>Astro Rashi Dashboard</title>
          EOF

          touch /tmp/published-site/.nojekyll

      - name: Publish static site to gh-pages
        run: |
          set -eu
          rm -rf /tmp/deploy-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/deploy-repo
          cd /tmp/deploy-repo
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/published-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy Astro Rashi to GitHub Pages"
          git push --force origin gh-pages
