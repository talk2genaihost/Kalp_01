name: Deploy KALP Applications to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: true
      - name: Checkout repository without external action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "${GITHUB_SHA}"
      - name: Restore Weather application from source branch
        working-directory: repo
        run: |
          set -eu
          rm -rf /tmp/weather-source
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/weather-source
      - name: Install dependencies
        working-directory: repo
        run: npm install --no-audit --no-fund
      - name: Build Astro Rashi browser slice
        working-directory: repo
        run: npm run build:astro-rashi
      - name: Build and smoke-test AdManthan v0.8.9 publish artifact
        working-directory: repo
        run: |
          set -eu
          rm -rf /tmp/admanthan-v089
          mkdir -p /tmp/admanthan-v089
          KALP_V089_OUT=/tmp/admanthan-v089/admanthan_browser.py python scripts/build_admanthan_v089.py
          grep -q 'VERSION = "0.8.9-semantic-production-fit"' /tmp/admanthan-v089/admanthan_browser.py
          grep -q 'KALP_V089_SEMANTIC_INTEGRATED = True' /tmp/admanthan-v089/admanthan_browser.py
          python -m py_compile /tmp/admanthan-v089/admanthan_browser.py
          python - <<'PY'
          import importlib.util
          p = "/tmp/admanthan-v089/admanthan_browser.py"
          spec = importlib.util.spec_from_file_location("admanthan_v089", p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert getattr(m, "VERSION", None) == "0.8.9-semantic-production-fit"
          assert getattr(m, "KALP_V089_SEMANTIC_INTEGRATED", False) is True
          assert hasattr(m, "_KALP_V088_CHOOSE_EFFECTS")
          assert hasattr(m, "evaluate_effect")
          assert callable(getattr(m, "choose_effects", None))
          print("AdManthan v0.8.9 runtime import smoke test: PASS")
          PY
      - name: Assemble published applications
        working-directory: repo
        run: |
          set -eu
          rm -rf /tmp/published-site
          mkdir -p /tmp/published-site/weather-dashboard
          mkdir -p /tmp/published-site/astro-rashi
          mkdir -p /tmp/published-site/admanthan
          cp -R /tmp/weather-source/weather-dashboard/. /tmp/published-site/weather-dashboard/
          cp -R dist/astro-rashi/. /tmp/published-site/astro-rashi/
          cp -R docs/admanthan-dashboard/. /tmp/published-site/admanthan/
          cp /tmp/admanthan-v089/admanthan_browser.py /tmp/published-site/admanthan/admanthan_browser.py
          cp docs/admanthan-dashboard/studio.html /tmp/published-site/admanthan/index.html
          sed -i 's/admanthan_browser.py?v=0.8.5/admanthan_browser.py?v=0.8.9/' /tmp/published-site/admanthan/index.html
          grep -q 'VERSION = "0.8.9-semantic-production-fit"' /tmp/published-site/admanthan/admanthan_browser.py
          grep -q 'KALP_V089_SEMANTIC_INTEGRATED = True' /tmp/published-site/admanthan/admanthan_browser.py
          python -m py_compile /tmp/published-site/admanthan/admanthan_browser.py
          python - <<'PY'
          import importlib.util
          p = "/tmp/published-site/admanthan/admanthan_browser.py"
          spec = importlib.util.spec_from_file_location("published_admanthan_v089", p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert getattr(m, "VERSION", None) == "0.8.9-semantic-production-fit"
          assert getattr(m, "KALP_V089_SEMANTIC_INTEGRATED", False) is True
          assert hasattr(m, "_KALP_V088_CHOOSE_EFFECTS")
          print("Published AdManthan v0.8.9 artifact smoke test: PASS")
          PY
          cat > /tmp/published-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>KALP Applications</title></head>
          <body><h1>KALP Applications</h1><ul><li><a href="./weather-dashboard/">Weather Dashboard</a></li><li><a href="./astro-rashi/">Astro Rashi Dashboard</a></li><li><a href="./admanthan/">KALP AdManthan</a></li><li><a href="./admanthan/research.html">AdManthan Research</a></li></ul></body></html>
          EOF
          cat > /tmp/published-site/astro-rashi.html <<'EOF'
          <!doctype html><meta http-equiv="refresh" content="0; url=./astro-rashi/" /><link rel="canonical" href="./astro-rashi/" /><title>Astro Rashi Dashboard</title>
          EOF
          touch /tmp/published-site/.nojekyll
      - name: Publish static site to gh-pages
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf /tmp/deploy-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/deploy-repo
          cd /tmp/deploy-repo
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/published-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy KALP Applications to GitHub Pages"
          git push --force origin gh-pages
